<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Carousel</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <header>
        <h1>Assignment 08</h1>
    </header>

    <div class="container">
        <h2>Part A: Product Carousel</h2>
        <div class="product-carousal">
            <div class="image-container">
                <img id="productImage" src="images/product/bike-1.jpg" alt="Bike Image">
            </div>
            <div class="buttons">
                <button onclick="startSpin(1)">Spin</button>
                <button onclick="startSpin(-1)">Reverse Spin</button>
                <button onclick="stopSpin()">Stop</button>
            </div>
        </div>
    </div>

    <div class="game-container">
        <h2>Part B: Pacman</h2>
        <p>Control movement using the <strong>W A S D</strong> keys, use <strong>X</strong> to stop</p>
        <div class="controls">
            <div class="keyboard">
                <button id="up">W</button>
                <div class="row">
                    <button id="left">A</button>
                    <button id="down">S</button>
                    <button id="right">D</button>
                </div>
                <button id="stop" class="active"><span id="x-button">X</span></button>
            </div>
        </div>
        <div class="game-box">
            <img id="pacman" src="images/pacman/pac-man-static.gif" alt="Pac-Man">
        </div>
    </div>

    <footer>
        <p id="footer-para">&copy; 2025 Interactive Showcase. All rights reserved.</p>
    </footer>

    <script src="./JS/script.js"></script>
</body>
</html>
