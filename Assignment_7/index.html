<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce T-Shirt</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

    <!-- Header -->
    <header>
        <h1>Assignment 07</h1>
    </header>       
    <div class="container">
        <h1>Product: <strong>Cotton T-Shirt</strong></h1>
        
        <div class="product">
            <div class="image-gallery">
                <img id="main-image" src="./product-images/t-shirt-black-no-model.jpg" alt="Main Product">
                <div class="thumbnails">
                    <img class="thumb active" data-view="no-model" src="./product-images/t-shirt-black-no-model.jpg">
                    <img class="thumb" data-view="front" src="./product-images/t-shirt-black-front.jpg">
                    <img class="thumb" data-view="back" src="./product-images/t-shirt-black-back.jpg">
                </div>
            </div>

            <div class="details">
                <!-- price info -->
                <div class="price-info">
                    <p><strong>Price:</strong> $20.00</p>
                <label for="quantity">Quantity:</label>
                <select id="quantity">
                    <option value="1" selected>1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                </select>
                <p><strong>Total:</strong> $<span id="total-price">20.00</span></p>
                </div>

                <!-- Color Selection -->
                <div class="option-box">
                    <p class="option-title">Color: <span id="color-text">black</span></p>
                    <label><input type="radio" name="color" value="black" checked> Black</label>
                    <label><input type="radio" name="color" value="red"> Red</label>
                    <label><input type="radio" name="color" value="grey"> Grey</label>
                </div>

                <!-- Size Selection -->
                <div class="option-box">
                    <p class="option-title">Size: <span id="size-text">Choose...</span></p>
                    <label><input type="radio" name="size" value="small"> Small S</label>
                    <label><input type="radio" name="size" value="medium"> Medium M</label>
                    <label><input type="radio" name="size" value="large"> Large L</label>
                </div>

            <div class="cart-button">
                <button id="add-to-cart" disabled>Choose A Size</button>
            </div>
            </div>
        </div>
    </div>
    <!-- Footer -->
    <footer>
        <p>© 2025 Your Company. All Rights Reserved by Annayesha Nargis.</p>
    </footer>    
    <script src="./JS/script.js"></script>
</body>
</html>
